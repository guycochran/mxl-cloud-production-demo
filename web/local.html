<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MXL Switcher</title>
<style>
  :root{
    --bg:#0c0e12; --panel:#14171d; --panel2:#1b1f27; --line:#272c36;
    --ink:#e9edf2; --muted:#8a93a0; --faint:#5b6472;
    --tally:#e5484d; --tally-glow:#e5484d88; --live:#30a46c; --amber:#d9a441;
    --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100%;
  }
  /* ── top bar: rack silkscreen ── */
  .rack{display:flex;align-items:center;gap:.9rem;padding:.7rem 1.1rem;border-bottom:1px solid var(--line);background:var(--panel)}
  .rack .brand{font-weight:800;letter-spacing:.02em;font-size:.95rem}
  .rack .brand span{color:var(--muted);font-weight:600}
  .rack .spacer{flex:1}
  .pill{display:inline-flex;align-items:center;gap:.4rem;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;
        text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:.22rem .5rem}
  .pill .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
  .pill.ok .dot{background:var(--live);box-shadow:0 0 6px var(--live)}
  .pill.ok{color:var(--ink)}
  .pill b{color:var(--ink);font-weight:700}

  main{flex:1;display:flex;flex-direction:column;max-width:1100px;width:100%;margin:0 auto;padding:1rem 1.1rem 2rem;gap:1rem}

  /* ── program monitor ── */
  .monitor{position:relative;background:#000;border:1px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:16/9}
  .monitor iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .monitor .pgmtag{position:absolute;top:10px;left:10px;z-index:2;display:inline-flex;align-items:center;gap:.45rem;
    font-family:var(--mono);font-size:.7rem;font-weight:700;letter-spacing:.14em;color:#fff;
    background:var(--tally);padding:.25rem .55rem;border-radius:4px;box-shadow:0 0 14px var(--tally-glow)}
  .monitor .pgmtag .live{width:8px;height:8px;border-radius:50%;background:#fff;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.monitor .pgmtag .live{animation:none}}

  /* ── cut bar ── */
  .barhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:.2rem}
  .barhead h2{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);margin:0;font-weight:700}
  .barhead .hint{font-size:.76rem;color:var(--faint)}
  .bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem}
  .src{
    position:relative;appearance:none;cursor:pointer;font-family:var(--sans);text-align:left;
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:9px;
    padding:.8rem .8rem .7rem;overflow:hidden;transition:border-color .12s,background .12s,transform .05s;
  }
  .src:hover{border-color:#3a414d;background:#1f242d}
  .src:active{transform:translateY(1px)}
  .src .num{font-family:var(--mono);font-size:.72rem;color:var(--muted)}
  .src .name{display:block;margin-top:.5rem;font-weight:650;font-size:.98rem;line-height:1.2}
  .src .tally{position:absolute;left:0;right:0;top:0;height:3px;background:transparent}
  /* ON AIR tally — the signature */
  .src.live{border-color:var(--tally);background:#241315}
  .src.live .tally{background:var(--tally);box-shadow:0 0 12px var(--tally-glow)}
  .src.live .num{color:var(--tally)}
  .src.live .name::after{content:"ON AIR";float:right;font-family:var(--mono);font-size:.6rem;font-weight:700;
    letter-spacing:.1em;color:var(--tally);border:1px solid var(--tally);border-radius:3px;padding:.05rem .3rem;margin-top:.05rem}

  /* ── controls row ── */
  .controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-top:.3rem}
  .btn{appearance:none;cursor:pointer;font-family:var(--sans);font-weight:600;font-size:.86rem;
    background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:.55rem .9rem;transition:border-color .12s,background .12s}
  .btn:hover{border-color:#3a414d;background:#1f242d}
  .btn.on{border-color:var(--amber);color:var(--amber);background:#241e10}
  select.btn{padding-right:.6rem}
  .grp{display:flex;align-items:center;gap:.5rem}
  .grp .lbl{font-family:var(--mono);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}

  footer{color:var(--faint);font-size:.76rem;text-align:center;padding:1rem}
  footer code{font-family:var(--mono);color:var(--muted)}
  :focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  .empty{color:var(--muted);font-size:.9rem;padding:1rem;border:1px dashed var(--line);border-radius:9px;text-align:center}
</style>
</head>
<body>
  <div class="rack">
    <div class="brand">MXL <span>Switcher</span></div>
    <div class="spacer"></div>
    <div class="pill" id="connPill"><span class="dot"></span><span id="connText">connecting…</span></div>
    <div class="pill"><span class="lbl">PGM</span>&nbsp;<b id="pgmLabel">—</b></div>
  </div>

  <main>
    <div class="monitor">
      <div class="pgmtag"><span class="live"></span>PROGRAM</div>
      <iframe id="pgm" src="/program/" allow="autoplay" title="Program output"></iframe>
    </div>

    <div class="barhead">
      <h2>Sources — click to cut</h2>
      <span class="hint">keys 1–9 cut · the lit source is on air</span>
    </div>
    <div class="bar" id="bar"><div class="empty">Loading sources from the facility manifest…</div></div>

    <div class="controls">
      <div class="grp"><span class="lbl">Key</span>
        <button class="btn" id="keyBtn">Graphics off</button>
      </div>
      <div class="grp"><span class="lbl">Pattern</span>
        <select class="btn" id="patSel"><option value="">—</option></select>
      </div>
      <div class="grp"><span class="lbl">Recover</span>
        <button class="btn" id="repairBtn" title="Rebuild the downstream program path">Repair program</button>
      </div>
    </div>
  </main>

  <footer>
    Driving the MXL facility through <code>/api/mxl/*</code> — the open control routes. No external services.
  </footer>

<script>
(function(){
  "use strict";
  var bar = document.getElementById('bar');
  var connPill = document.getElementById('connPill');
  var connText = document.getElementById('connText');
  var pgmLabel = document.getElementById('pgmLabel');
  var keyBtn = document.getElementById('keyBtn');
  var patSel = document.getElementById('patSel');
  var repairBtn = document.getElementById('repairBtn');
  var slots = [];        // [{slot, role, label}]
  var active = null;     // current on-air slot index
  var keyOn = false;
  var busy = false;

  function post(url, body){
    return fetch(url, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body||{})});
  }

  function paintActive(){
    var btns = bar.querySelectorAll('.src');
    btns.forEach(function(b){
      var on = String(b.dataset.slot) === String(active);
      b.classList.toggle('live', on);
    });
    var s = slots.find(function(x){return String(x.slot)===String(active)});
    pgmLabel.textContent = s ? s.label : '—';
  }

  function cut(slot){
    if(busy) return;
    busy = true;
    var input = (slot === 0) ? 'cam' : slot;  // route maps 0->cam, else numeric
    post('/api/mxl/input', {input: slot})
      .then(function(r){ return r.json(); })
      .then(function(){ active = slot; paintActive(); })
      .catch(function(){})
      .finally(function(){ busy = false; });
  }

  function buildBar(){
    if(!slots.length){ bar.innerHTML = '<div class="empty">No sources in the facility manifest.</div>'; return; }
    bar.innerHTML = '';
    slots.forEach(function(s){
      var b = document.createElement('button');
      b.className = 'src';
      b.dataset.slot = s.slot;
      b.innerHTML = '<span class="tally"></span><span class="num">'+(s.slot+1)+'</span><span class="name">'+
                    escapeHtml(s.label)+'</span>';
      b.addEventListener('click', function(){ cut(s.slot); });
      bar.appendChild(b);
    });
    paintActive();
  }

  function escapeHtml(t){ return String(t).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  // ── status poll: connection + active slot + key state ──
  function refresh(){
    fetch('/api/mxl/status').then(function(r){ return r.json(); }).then(function(st){
      if(st && !st.error){
        connPill.classList.add('ok'); connText.textContent = 'connected';
        if(st.input !== undefined && !busy){ active = st.input; paintActive(); }
        if(st.key !== undefined){ keyOn = !!st.key; keyBtn.textContent = keyOn ? 'Graphics on' : 'Graphics off';
          keyBtn.classList.toggle('on', keyOn); }
        if(st.available && patSel.options.length <= 1){
          st.available.forEach(function(p){ var o=document.createElement('option'); o.value=p; o.textContent=p; patSel.appendChild(o); });
        }
      } else {
        connPill.classList.remove('ok'); connText.textContent = 'no backend';
      }
    }).catch(function(){ connPill.classList.remove('ok'); connText.textContent = 'offline'; });
  }

  keyBtn.addEventListener('click', function(){
    post('/api/mxl/key', {on: !keyOn}).then(function(){ keyOn=!keyOn;
      keyBtn.textContent = keyOn?'Graphics on':'Graphics off'; keyBtn.classList.toggle('on', keyOn); }).catch(function(){});
  });
  patSel.addEventListener('change', function(){ if(patSel.value) post('/api/mxl/pattern', {pattern: patSel.value}).catch(function(){}); });
  repairBtn.addEventListener('click', function(){
    repairBtn.disabled = true; repairBtn.textContent = 'Repairing…';
    post('/api/mxl/repair', {}).catch(function(){}).finally(function(){
      setTimeout(function(){ repairBtn.disabled=false; repairBtn.textContent='Repair program'; }, 2500); });
  });

  // number keys 1–9 cut the matching source
  document.addEventListener('keydown', function(e){
    if(e.target.tagName === 'SELECT') return;
    var n = parseInt(e.key, 10);
    if(n >= 1 && n <= slots.length){ cut(slots[n-1].slot); }
  });

  // boot: load slot layout from the manifest, then poll status
  fetch('/api/mxl/slots').then(function(r){ return r.json(); }).then(function(d){
    slots = (d && d.slots) || []; buildBar();
  }).catch(function(){ buildBar(); });
  refresh(); setInterval(refresh, 2000);
})();
</script>
</body>
</html>
