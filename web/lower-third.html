<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  /* Transparent everywhere so CEF keys cleanly */
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 1920px; height: 1080px; }

  .strap {
    position: absolute;
    left: 96px;
    bottom: 96px;
    display: flex;
    flex-direction: column;
    font-family: "DejaVu Sans", Arial, sans-serif;
    animation: slideIn 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both;
  }
  @keyframes slideIn {
    from { transform: translateX(-60px); opacity: 0; }
    to   { transform: translateX(0);      opacity: 1; }
  }
  .name {
    background: linear-gradient(90deg, rgba(10,14,26,0.92) 0%, rgba(10,14,26,0.78) 80%, rgba(10,14,26,0) 100%);
    color: #ffffff;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 18px 120px 14px 28px;
    border-left: 10px solid #ffb400;
  }
  .title {
    background: linear-gradient(90deg, rgba(255,180,0,0.95) 0%, rgba(255,180,0,0.85) 70%, rgba(255,180,0,0) 100%);
    color: #14181f;
    font-size: 30px;
    font-weight: 600;
    padding: 8px 140px 8px 30px;
    width: max-content;
  }
  .bug {
    position: absolute;
    top: 64px;
    right: 96px;
    font-family: "DejaVu Sans", Arial, sans-serif;
    background: rgba(10,14,26,0.85);
    color: #fff;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 10px 18px;
    border-radius: 6px;
    border-left: 6px solid #e02020;
  }
  .bug .dot {
    display: inline-block; width: 14px; height: 14px; border-radius: 50%;
    background: #e02020; margin-right: 10px;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .clock {
    position: absolute;
    bottom: 96px;
    right: 96px;
    font-family: "DejaVu Sans Mono", monospace;
    background: rgba(10,14,26,0.85);
    color: #ffb400;
    font-size: 34px;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 6px;
  }
</style>
</head>
<body>
  <div class="bug"><span class="dot"></span>MXL&nbsp;LIVE</div>
  <div class="strap">
    <div class="name">OFFICE HOURS GLOBAL</div>
    <div class="title">MXL Lab &mdash; live from Azure &bull; shared-memory production</div>
  </div>
  <div class="clock" id="clock"></div>
  <script>
    const c = document.getElementById('clock');
    setInterval(() => { c.textContent = new Date().toLocaleTimeString('en-US', { hour12: false }); }, 200);
  </script>
</body>
</html>
